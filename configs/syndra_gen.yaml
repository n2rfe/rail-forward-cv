# SynDRA-Gen evaluation settings, with the label ids found in SynDRA-Gen output (Nov 2026 build):
#   15 = rails of the ego track, 12 = rails of other tracks (also drawn over the ego rails at switches),
#   14 / 13 = full-width sleepers / ballast bed of the ego track (wider than the ego path, so not used).
# Generic notes follow.
# SynDRA / SynDRA-Gen evaluation settings.
# Dataset: https://syndra.retis.santannapisa.it/syndra.html   Generator: https://github.com/DAmicoGlc/SynDRA-Gen
# (CC BY-NC 4.0, research use, cite the SynDRA paper)

# SynDRA dataset camera: 1920x1080, 90 deg horizontal FOV, 3.5 m above the rails, level,
# stereo pair 0.6 m apart. fx = (width / 2) / tan(HFOV / 2) = 960 px. No lens distortion (rendered).
# SynDRA-Gen: set hfov_deg and height_m to what you chose in the Acquisition Setup menu. The frame
# size is read from the files; width/height here are only a first guess. height_m: null = unknown.
camera:
  width: 1920
  height: 1080
  hfov_deg: 90.0
  height_m: null        # the menu's Z offset (250 cm) is above the track bed, not the rail head
  index: 0              # 0 = mono or left camera, 1 = right camera

# Depth camera (SynDRA-Gen, optional). Raw 16-bit units per metre. SynDRA-Gen depth is planar depth in
# centimetres (checked: the track bed straight ahead reads the Z offset set in the menu). null = ignore depth.
depth:
  units_per_m: 100

track:
  # Rail center-to-center spacing assumed for ranging. syndra_eval.py prints the gauge implied by the
  # ground-truth rails ("implied_gauge_m"); if it differs consistently, put that value here.
  gauge_center_to_center_m: 1.505

# Semantic label values. They are NOT published: find them with
#     python scripts/syndra_labels.py --seq <sequence folder>
# Each entry is an [R, G, B] color (color label PNGs) or a single integer (SynDRA-Gen label ids).
# Class names follow the SynDRA paper; "main" = the ego track, "other" = neighboring tracks.
# Only the ego_rails class is required. If the label set has no "between the rails" classes, leave
# those null: the ground-truth ego path is then the area between the ground-truth rails.
labels:
  railraised-main: 15
  ballast-int-main: null
  sleeper-int-main: null
  ballast-ext-main: null
  sleeper-ext-main: null
  railraised-other: 12

# Ground-truth ego path = the region between the ego rails, rails included
# (the SynDRA paper's "Railway" group for the main track).
ego_region: [railraised-main, ballast-int-main, sleeper-int-main]
# Ground-truth rail centerlines are traced in this class.
ego_rails: railraised-main
# Other rail classes, consulted only where the ego-rail label drops out. In SynDRA-Gen another track's
# rails are drawn over the ego rails at switches.
other_rails: [railraised-other]

eval:
  stride: 5             # SynDRA is 10 FPS; evaluate every 5th frame (2 Hz) by default
  min_rail_sep_px: 6    # ignore GT rows where the two rails are closer than this
  range_checkpoints_m: [10, 20, 30, 50, 75]
